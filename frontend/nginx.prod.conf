server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy is the only container on this network allowed to reach the frontend.
    # It replaces client-supplied forwarding headers before proxying the request.
    location /api/ {
        # Re-resolve Compose service names after a backend container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
