services:
  mongo:
    ports: !override []
    mem_limit: 1g
    cpus: 0.70

  backend:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: ${CALM_MONGO_URI:?Set CALM_MONGO_URI in the project .env}
      CALM_CORS_ORIGINS: https://peaceofmindforyourhead.duckdns.org
    mem_limit: 768m
    cpus: 0.70

  frontend:
    ports: !override []
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default: {}
      proxy:
        ipv4_address: 172.30.250.3
    mem_limit: 128m
    cpus: 0.15

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 172.30.250.2
    mem_limit: 128m
    cpus: 0.20
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    name: calm_proxy
    ipam:
      config:
        - subnet: 172.30.250.0/24
